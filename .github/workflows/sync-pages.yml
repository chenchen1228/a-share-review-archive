name: Sync public A-share review to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-mirror
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify the complete public report
        id: mirror
        run: python3 sync_public_site.py --output docs
      - name: Commit updated reports and history
        if: steps.mirror.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Synchronize public review and archive'
          git push
      - uses: actions/configure-pages@v5
        if: steps.mirror.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mirror.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: docs
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.mirror.outputs.changed == 'true' || github.event_name != 'schedule'
